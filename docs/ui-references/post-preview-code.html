<script>
        // Theme Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            if (html.classList.contains('light')) {
                html.classList.remove('light');
                html.classList.add('dark');
                themeIcon.innerText = 'light_mode';
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                themeIcon.innerText = 'dark_mode';
            }
        });

        // Save Button Interaction
        const saveBtn = document.getElementById('savePostBtn');
        const saveIcon = document.getElementById('saveBtnIcon');
        const saveText = document.getElementById('saveBtnText');
        const bookmarkIcon = document.getElementById('bookmarkIcon');
        let isSaved = false;

        saveBtn.addEventListener('click', () => {
            isSaved = !isSaved;
            if (isSaved) {
                saveIcon.innerText = 'bookmark_added';
                saveIcon.style.fontVariationSettings = "'FILL' 1";
                saveText.innerText = 'SAVED';
                bookmarkIcon.style.fontVariationSettings = "'FILL' 1";
                saveBtn.classList.replace('bg-tertiary-container', 'bg-tertiary');
                saveBtn.classList.replace('text-on-tertiary-container', 'text-on-tertiary');
            } else {
                saveIcon.innerText = 'bookmark_add';
                saveIcon.style.fontVariationSettings = "'FILL' 0";
                saveText.innerText = 'SAVE POST';
                bookmarkIcon.style.fontVariationSettings = "'FILL' 0";
                saveBtn.classList.replace('bg-tertiary', 'bg-tertiary-container');
                saveBtn.classList.replace('text-on-tertiary', 'text-on-tertiary-container');
            }
        });
    </script>
